[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-copilot"
version = "0.7.0"
readme = "README.md"
description = "Evidence-based football and VALORANT lakehouse copilot"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "duckdb>=1.2,<2", "numpy>=2,<3", "pyarrow>=19,<24", "langgraph>=0.6,<2", "langgraph-checkpoint-sqlite>=2,<4", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
observability = ["mlflow>=3.14,<4"]
legacy-ui = ["streamlit>=1.45,<2"]

[project.scripts]
arena-copilot = "arena_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arena_copilot = ["fixture/**/*", "showcase/**/*", "research_fixture/**/*", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
